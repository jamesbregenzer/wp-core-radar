# WP Core Radar scoring configuration
#
# Scores are intentionally deterministic and explainable.
# The runtime scoring rules currently live in scripts/radarlib.py so the
# project has no non-stdlib YAML dependency. This file is documentation for
# reviewers and should match score_ticket() exactly.

baseline:
  default_query_priority: 50
  query_priority_source: config/queries.json

positive:
  has-patch: 35
  needs-testing: 30
  dev-feedback: 18
  reporter-feedback: 10
  good-first-bug: 20
  media-component: 20
  accessibility-signal: 18
  concrete-milestone: 8
  owner-assigned: 6
  freshness-recently-updated-14-days: 20
  freshness-updated-within-60-days: 10
  ticket-age-mature-30-to-730-days: 8
  momentum-healthy-comment-count-2-to-20: 7

negative:
  closed-or-non-actionable-status: -100
  already-produced-props: -60
  already-tested: -20
  setup-complexity-requires-woocommerce: -18
  setup-complexity-specialized-image-library: -18
  setup-complexity-server-runtime-configuration: -16
  setup-complexity-external-service-or-api: -16
  setup-complexity-multisite-environment: -14
  setup-complexity-custom-content-type-setup: -12
  setup-complexity-browser-specific-behavior: -12
  freshness-stale-activity-over-2-years: -10
  missing-summary: -10
  ticket-age-very-old-over-10-years: -8
  momentum-very-large-thread-over-80-comments: -8
